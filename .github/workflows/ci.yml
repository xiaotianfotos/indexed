name: Indexed CI

on:
  push:
    branches: [main]
  pull_request:
    # Match HomeRail: review a coherent, ready PR; use manual dispatch to rerun.
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexed-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application and public-source checks
    if: >-
      github.actor == github.repository_owner &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.user.login == github.repository_owner &&
        github.event.pull_request.draft == false))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Isolate test state
        run: echo "INDEXED_HOME=$RUNNER_TEMP/indexed-ci" >> "$GITHUB_ENV"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - name: Check public source and reachable publication history
        run: node scripts/audit-public-source.mjs --history-ref HEAD
      - name: Install test media tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg poppler-utils zip unzip
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Verify source and dependency lockfile remain unchanged
        run: |
          git diff --check
          git diff --exit-code
      # No Release, native binary upload, real model or user data in this workflow.
      # Real Apple ANE/runtime acceptance remains a separate local macOS check.
